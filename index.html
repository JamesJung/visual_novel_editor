<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StorySim Studio · Prototype</title>
<style>
:root{font-family:Inter,system-ui,"Apple SD Gothic Neo",sans-serif;color:#e8ebf3;background:#0c111c;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #37435b;background:#243049;color:#ecf2ff;border-radius:9px;padding:9px 12px}button:hover{background:#324360}button.primary{background:#5877e5;border-color:#7792f2}button.danger{color:#ffb2b2}button:disabled{opacity:.4;cursor:not-allowed}input,textarea,select{background:#101a2c;color:#e8ebf3;border:1px solid #35425a;border-radius:8px;padding:9px;width:100%}textarea{resize:vertical;min-height:68px}label{display:block;color:#b4c0d3;margin:10px 0 5px}small,.muted{color:#9daac0}h1{font-size:17px;margin:0}h2{font-size:19px;margin:0 0 12px}h3{font-size:14px;margin:10px 0}header{height:64px;border-bottom:1px solid #27344a;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#141e2e}.shell{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:calc(100vh - 64px)}nav{background:#131e2e;border-right:1px solid #29364d;padding:20px 12px}nav button{display:block;width:100%;text-align:left;margin:7px 0;border:none;background:none}nav button.active{background:#30446d}main{padding:24px;max-width:1480px;width:100%;margin:auto}.grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px}.panel{border:1px solid #2b3a51;background:#172337;border-radius:14px;padding:18px;min-width:0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:11px}.chip{background:#283858;border-radius:20px;padding:4px 9px;font-size:12px;color:#a8c6ff}.asset{width:100%;aspect-ratio:2/3;object-fit:contain;background:radial-gradient(circle,#364662 0%,#1d293c 70%);border:1px dashed #536684;border-radius:9px}.asset.mini{height:110px;width:86px}.assets{display:flex;gap:8px;overflow-x:auto;padding:6px 0}.assetcard{min-width:100px;border:1px solid #34435b;border-radius:9px;padding:7px;text-align:center}.assetcard.selected{border-color:#85a0ff}.assetcard img{height:110px;width:86px;object-fit:contain}.assetcard button{padding:5px;font-size:11px}.preview{height:490px;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(140deg,#465679,#1a2539 80%)}.preview .actor{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);height:78%;max-width:90%;object-fit:contain}.preview .dialog{position:absolute;bottom:12px;left:3%;width:94%;min-height:115px;border:1px solid #9cb0d5;background:#0c1528e9;border-radius:10px;padding:15px}.preview .speaker{font-weight:800;color:#b2c6ff}.preview .blank{position:absolute;top:27%;width:100%;text-align:center;color:#d9e6ff}.preview .choices{position:absolute;top:15px;left:15px;right:15px;display:grid;gap:7px}.preview .choices button{background:#202e4eea}.notice{border:1px solid #59698b;background:#1b2a43;border-radius:10px;padding:12px;color:#c5d7ff}.warn{color:#ffcc8c}.status{min-height:19px;color:#9cd9c2}.inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.filebutton{display:inline-block;background:#243049;border:1px solid #37435b;border-radius:9px;padding:9px 12px;cursor:pointer}.filebutton input{display:none}pre{white-space:pre-wrap;word-break:break-word;background:#101a2c;padding:12px;border-radius:8px}.scroll{max-height:480px;overflow:auto}.sceneitem{padding:11px;border:1px solid #34435b;border-radius:8px;cursor:pointer;margin:7px 0}.sceneitem.active{background:#30446d}.footer{margin-top:16px;color:#8a9ab4;font-size:12px}@media(max-width:920px){.grid{grid-template-columns:1fr}.shell{grid-template-columns:1fr}nav{display:flex;overflow:auto;padding:7px}nav button{min-width:110px;text-align:center}main{padding:12px}header{padding:0 12px}.preview{height:420px}}
</style></head><body>
<header><div class="row"><strong>✦ StorySim Studio</strong><span class="chip">Prototype v0.1</span></div><div class="row"><span id="saving" class="muted">브라우저 로컬 저장</span><button id="exportBtn">프로젝트 JSON 내보내기</button><label class="filebutton">JSON 가져오기<input id="importFile" type="file" accept="application/json,.json"></label></div></header>
<div class="shell"><nav><button data-tab="dashboard" class="active">▦ 프로젝트</button><button data-tab="characters">♙ 캐릭터 스튜디오</button><button data-tab="scenes">☰ 씬 편집기</button><button data-tab="play">▷ 플레이 테스트</button></nav><main id="app"></main></div>
<script>
"use strict";
const KEY="storysim-prototype-v1",expressions=["neutral","smile","frown","angry","crying","surprised"];
const initial=()=>({name:"스타트업 시뮬레이션 (샘플)",characters:[{id:"founder",name:"김도현",description:"창업자. 현실적인 낙관주의자",master:null,expressions:{},approved:[],canvas:{w:1024,h:1536}}],scenes:[{id:"scene_1",title:"첫 번째 창업",speaker:"김도현",character:"founder",expression:"neutral",background:"#435272",text:"우리에겐 단 세 달의 자금만 남았다. 어떤 선택을 해야 할까?",choices:[{text:"개발에 집중한다",next:"scene_2",effect:"제품 완성도 +20"},{text:"투자를 알아본다",next:"scene_2",effect:"투자자 신뢰 +10"}]},{id:"scene_2",title:"다음 날",speaker:"김도현",character:"founder",expression:"smile",background:"#52617d",text:"오늘부터 새로운 선택의 결과를 만들어가자.",choices:[]}],variables:{"현금":1000,"제품 완성도":20,"투자자 신뢰":10}});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial()}catch{data=initial()}
let tab="dashboard",charId=data.characters[0]?.id||"",sceneId=data.scenes[0]?.id||"",playId="",playHistory=[],playVars={},playStarted=false;
const $=s=>document.querySelector(s), app=$("#app"), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||"id_"+Date.now().toString(36)+Math.random().toString(36).slice(2);
const ch=()=>data.characters.find(x=>x.id===charId),sc=()=>data.scenes.find(x=>x.id===sceneId);
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));$("#saving").textContent="저장됨 ✓"}catch(e){$("#saving").textContent="저장 실패: 용량 초과. JSON을 내보내세요.";alert("로컬 저장 용량을 초과했습니다. JSON 내보내기로 백업하세요.")}}
function setData(fn){fn();save();render()}
function resetPlay(){playId=data.scenes[0]?.id||"";playHistory=[];playVars={...data.variables};playStarted=true}
function nav(t){tab=t;render()}document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>nav(b.dataset.tab));
$("#exportBtn").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="storysim-project.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("#importFile").onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(!obj||!Array.isArray(obj.characters)||!Array.isArray(obj.scenes)||typeof obj.variables!=="object")throw Error("필수 항목 누락");if(!confirm("현재 로컬 프로젝트를 교체할까요?"))return;data=obj;playStarted=false;charId=data.characters[0]?.id||"";sceneId=data.scenes[0]?.id||"";save();render()}catch(err){alert("가져오기 실패: "+err.message)}e.target.value=""};
const img=(src,cl="asset")=>src?'<img class="'+cl+'" src="'+src+'" alt="캐릭터 에셋">':'<div class="'+cl+'" style="display:grid;place-items:center;color:#8196b8">이미지 없음</div>';
function fileRead(file){return new Promise((ok,fail)=>{if(!file.type.startsWith("image/"))return fail(Error("이미지 파일만 허용"));if(file.size>4*1024*1024)return fail(Error("이미지는 4MB 이하만 지원 (로컬 저장 제한)"));const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=fail;r.readAsDataURL(file)})}
async function upload(id,expression,file){try{let src=await fileRead(file);const im=new Image;im.src=src;await im.decode();if(im.naturalWidth<64||im.naturalHeight<64)throw Error("이미지가 너무 작습니다");const c=data.characters.find(v=>v.id===id);if(!c)return;let warnings=[];if(c.master&&(im.naturalWidth!==c.master.w||im.naturalHeight!==c.master.h))warnings.push("마스터 이미지와 해상도가 다릅니다");const asset={src,w:im.naturalWidth,h:im.naturalHeight,version:Date.now(),warnings};if(expression==="master"){c.master=asset;c.approved=[];c.expressions={}}else{c.expressions[expression]=asset;c.approved=c.approved.filter(x=>x!==expression)}save();render()}catch(e){alert(e.message)}}
const generationJobs=new Map();
function generationPanel(c){const job=generationJobs.get(c.id);return '<div class="panel stack"><h3>AI 마스터 생성</h3><label for="generationDescription">캐릭터 설명</label><textarea id="generationDescription" maxlength="4000">'+esc(c.generationDescription||c.description)+'</textarea><label for="generationStyle">화풍</label><select id="generationStyle"><option>2D 비주얼 노블 일러스트</option><option>카툰 SD 캐릭터</option><option>반실사 일러스트</option></select><p class="muted">전신 · 정면 · 기본 표정 · 단색 배경. 생성 1회당 API 비용이 발생합니다. 자동 재시도하지 않습니다.</p><button id="generateMaster" class="primary" '+(job?.pending?'disabled':'')+'>'+(job?.pending?'생성 중…':'마스터 이미지 생성')+'</button><div role="status" aria-live="polite">'+esc(job?.message||'서버에서 API 키를 설정해야 사용할 수 있습니다.')+'</div>'+(c.pendingMaster?img(c.pendingMaster.src)+'<p>검토 대기 · 기존 마스터는 유지됩니다.</p><div class="row"><button id="adoptMaster">검토 후 마스터로 채택</button><button id="discardMaster">후보 버리기</button><a class="filebutton" download="master-candidate.png" href="'+esc(c.pendingMaster.src)+'">이미지 다운로드</a></div><small>모델: '+esc(c.pendingMaster.generation.model)+' · 생성 시간: '+Math.round(c.pendingMaster.generation.durationMs/1000)+'초 · 비용: 공급자 사용 내역 확인</small>':'')+'</div>';}
async function generateMaster(){const c=ch();if(!c||generationJobs.get(c.id)?.pending)return;const description=$('#generationDescription').value.trim(),style=$('#generationStyle').value;if(description.length<5){alert('캐릭터 설명을 5자 이상 입력하세요.');return;}c.generationDescription=description;const project=data;const job={pending:true,message:'이미지를 생성하고 있습니다. 잠시 기다려 주세요.'};generationJobs.set(c.id,job);save();render();try{const res=await fetch('/api/generate-master',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({description,style,requestId:uid()})});let out;try{out=await res.json()}catch{throw Error('생성 서버에 연결할 수 없습니다. npm run dev로 실행하세요.')}if(!res.ok)throw Error(out.error||'생성 실패');const im=new Image();im.src=out.src;await im.decode();if(project!==data||!project.characters.includes(c))return;c.pendingMaster={src:out.src,w:im.naturalWidth,h:im.naturalHeight,version:out.generation.id,warnings:[],status:'review_required',generation:out.generation};job.message='생성 완료. 이미지를 검토한 뒤 채택하세요.';save();}catch(e){job.message=e.message;}finally{job.pending=false;if(project===data)render();}}
function adoptMaster(){const c=ch();if(!c?.pendingMaster)return;const previousRefs=data.scenes.map(scene=>scene.masterVersion);const previous={master:c.master,expressions:c.expressions,approved:c.approved};const candidate=c.pendingMaster;const oldVersions=c.masterVersions||[];c.masterVersions=[...oldVersions,...(c.master?[{...previous,version:c.master.version,archivedAt:new Date().toISOString()}]:[])];for(const scene of data.scenes)if(scene.character===c.id&&c.master&&!scene.masterVersion)scene.masterVersion=c.master.version;c.master={...candidate,status:'approved'};c.expressions={};c.approved=[];delete c.pendingMaster;try{localStorage.setItem(KEY,JSON.stringify(data));$('#saving').textContent='저장됨 ✓';render()}catch{data.scenes.forEach((scene,i)=>{if(previousRefs[i]===undefined)delete scene.masterVersion;else scene.masterVersion=previousRefs[i]});c.master=previous.master;c.expressions=previous.expressions;c.approved=previous.approved;c.masterVersions=oldVersions;c.pendingMaster=candidate;alert('저장 공간이 부족해 채택하지 않았습니다. 후보 이미지를 다운로드하고 JSON으로 백업하세요.');render();}}

const variationJobs=new Map();
let variationExpression='smile';
function variationPanel(c){const job=variationJobs.get(c.id),a=c.variationCandidates?.[variationExpression],valid=a&&c.master&&a.masterVersion===c.master.version&&a.w===c.master.w&&a.h===c.master.h;
return '<div class="panel stack"><h3>마스터 기반 표정 variation</h3><p class="muted">모든 표정은 현재 마스터 원본을 직접 참조합니다. 생성물은 자동 승인되지 않습니다.</p><label for="variationExpression">생성할 표정</label><select id="variationExpression">'+expressions.map(e=>'<option '+(variationExpression===e?'selected':'')+'>'+e+'</option>').join('')+'</select><button id="generateVariation" class="primary" '+(!c.master||job?.pending?'disabled':'')+'>'+(job?.pending?'표정 생성 중…':'선택한 표정 생성')+'</button><p role="status" aria-live="polite">'+esc(job?.message||'표정당 1회 API 호출 · 비용 발생 · 실패 시 자동 재시도 없음')+'</p>'+(a?'<h3>마스터 / 생성 후보 비교</h3><div class="inline"><div>'+img(c.master?.src)+'<small>마스터 원본</small></div><div>'+img(a.src)+'<small>'+esc(variationExpression)+' · '+a.w+'×'+a.h+'</small></div></div><p class="warn">'+(!valid?'마스터 버전 또는 해상도 불일치: 승인 불가':'해상도 일치. 얼굴·위치·의상은 직접 검토하세요.')+'</p><div class="row"><button id="approveVariation" '+(!valid?'disabled':'')+'>검토 후 표정 승인</button><button id="discardVariation">후보 버리기</button><a class="filebutton" href="'+esc(a.src)+'" download="expression-candidate.png">후보 다운로드</a></div>':'')+'</div>';}
async function generateVariation(){const c=ch();if(!c?.master||variationJobs.get(c.id)?.pending)return;const expression=variationExpression,master=c.master,project=data;const job={pending:true,message:expression+' 생성 중 · 마스터 원본 직접 참조'};variationJobs.set(c.id,job);render();try{const res=await fetch('/api/generate-variation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestId:uid(),masterSrc:master.src,masterVersion:master.version,expression})});let out;try{out=await res.json()}catch{throw Error('생성 서버에 연결할 수 없습니다. npm run dev로 실행하세요.')}if(!res.ok)throw Error(out.error||'표정 생성 실패');const im=new Image();im.src=out.src;await im.decode();if(project!==data||!project.characters.includes(c)||c.master!==master){job.message='생성 중 마스터가 변경되어 결과를 적용하지 않았습니다. 공급자 사용 내역을 확인하세요.';return;}c.variationCandidates??={};c.variationCandidates[expression]={src:out.src,w:im.naturalWidth,h:im.naturalHeight,version:out.generation.id,masterVersion:master.version,characterId:c.id,status:'review_required',generation:out.generation,warnings:[]};job.message='후보 생성 완료. 마스터와 비교한 뒤 개별 승인하세요.';save();}catch(e){job.message=e.message;}finally{job.pending=false;if(project===data)render();}}
function approveVariation(){const c=ch(),e=variationExpression,a=c?.variationCandidates?.[e];if(!a||!c.master||a.masterVersion!==c.master.version||a.w!==c.master.w||a.h!==c.master.h)return;
const old=c.expressions[e],approved=[...c.approved],oldVersions=c.expressionVersions||[],refs=data.scenes.map(s=>s.expressionAssetVersion);
if(old){c.expressionVersions=[...oldVersions,{...old,expression:e}];for(const scene of data.scenes)if(c.approved.includes(e)&&scene.character===c.id&&scene.expression===e&&!scene.expressionAssetVersion&&!scene.masterVersion)scene.expressionAssetVersion=old.version;}
c.expressions[e]={...a,status:'approved'};if(!c.approved.includes(e))c.approved.push(e);delete c.variationCandidates[e];
try{localStorage.setItem(KEY,JSON.stringify(data));$('#saving').textContent='저장됨 ✓';}catch{if(old)c.expressions[e]=old;else delete c.expressions[e];c.approved=approved;c.expressionVersions=oldVersions;c.variationCandidates[e]=a;data.scenes.forEach((s,i)=>{if(refs[i]===undefined)delete s.expressionAssetVersion;else s.expressionAssetVersion=refs[i]});alert('저장 공간이 부족해 승인하지 않았습니다. 후보 다운로드 또는 JSON 백업을 사용하세요.');}render();}
function dashboard(){return '<h2>프로젝트</h2><div class="grid"><div class="panel stack"><label>프로젝트 이름</label><input id="projectName" value="'+esc(data.name)+'"><h3>빠른 시작</h3><button id="goCharacters">1. 캐릭터 이미지 등록</button><button id="goScenes">2. 스토리 편집</button><button id="goPlay" class="primary">3. 게임 실행</button><button id="resetProject" class="danger">샘플로 초기화</button></div><div class="panel stack"><h3>구현 범위</h3><div class="notice">캐릭터 마스터 및 6표정 이미지 업로드 · 크기 검사 · 승인 · 스토리 씬과 선택지 편집 · 브라우저 플레이 · 로컬 저장 · JSON 가져오기/내보내기</div><div class="warn">AI 마스터 생성은 서버 API 키 설정 후 사용할 수 있습니다. 얼굴 정체성 자동 평가, 서버 프로젝트 저장, 로그인/과금은 없습니다. 이미지의 크기가 일치해도 얼굴 일관성이 보장되지 않습니다.</div><h3>현황</h3><p>캐릭터 '+data.characters.length+'명 · 씬 '+data.scenes.length+'개 · 변수 '+Object.keys(data.variables).length+'개</p></div></div>'}
function characters(){const c=ch();return '<div class="row between"><h2>캐릭터 스튜디오</h2><button id="addCharacter">+ 캐릭터 추가</button></div><div class="grid"><div class="panel stack"><label>캐릭터 선택</label><select id="charSelect">'+data.characters.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===charId?'selected':'')+'>'+esc(x.name)+'</option>').join("")+'</select>'+(c?'<label>이름</label><input id="charName" value="'+esc(c.name)+'"><label>캐릭터 설정</label><textarea id="charDesc">'+esc(c.description)+'</textarea>'+generationPanel(c)+'<div class="row between"><b>마스터 이미지 (원본)</b><span class="chip">불변 버전 대신 업로드 갱신 실험용</span></div>'+img(c.master?.src)+'<label class="filebutton">마스터 이미지 업로드<input id="masterUpload" type="file" accept="image/*"></label><small>마스터 교체 시 표정 세트는 초기화됩니다. 이 프로토타입은 영구 버전 관리를 지원하지 않습니다.</small>':'캐릭터가 없습니다')+'</div><div class="panel">'+(c?variationPanel(c)+'<h3>표정 세트 · 6종</h3><p class="muted">마스터와 똑같은 픽셀 크기인지 확인합니다. 일치하지 않으면 승인할 수 없습니다.</p><div class="assets">'+expressions.map(e=>{const a=c.expressions[e],valid=a&&c.master&&a.w===c.master.w&&a.h===c.master.h,approved=c.approved.includes(e);return '<div class="assetcard">'+img(a?.src,"asset mini")+'<div>'+e+'</div><small>'+(a?a.w+'×'+a.h:"미등록")+'</small>'+(a&&!valid?'<div class="warn">크기 불일치</div>':'')+'<div>'+(approved?'✓ 승인됨':'미승인')+'</div><label class="filebutton" style="font-size:11px">업로드<input type="file" accept="image/*" data-upload="'+e+'"></label><button data-approve="'+e+'" '+(!valid?'disabled':'')+'>'+(approved?'승인 취소':'승인')+'</button></div>'}).join("")+'</div><h3>원본/표정 비교</h3><div class="inline"><div>'+img(c.master?.src)+'<small>마스터 · '+(c.master?c.master.w+'×'+c.master.h:'미등록')+'</small></div><div><select id="compareExpression">'+expressions.map(x=>'<option>'+x+'</option>').join("")+'</select><div id="compareTarget">'+img(c.expressions.neutral?.src)+'</div></div></div><p class="notice">검사 범위: 파일 크기·픽셀 크기·마스터와 해상도 일치. 자동 얼굴 비교·눈/입 anchor 분석·정규화는 미구현.</p>':'먼저 캐릭터를 추가하세요')+'</div></div>'}
function editSceneField(field,value){const scene=sc();scene[field]=value;if(field==="character"||field==="expression")delete scene.expressionAssetVersion;if(field==="character")delete scene.masterVersion;}
function scenes(){const s=sc();return '<div class="row between"><h2>씬 편집기</h2><button id="addScene">+ 씬 추가</button></div><div class="grid"><div class="panel"><h3>장면 목록</h3>'+data.scenes.map(x=>'<div class="sceneitem '+(x.id===sceneId?'active':'')+'" data-scene="'+esc(x.id)+'">'+esc(x.title)+'</div>').join("")+'</div><div class="panel stack">'+(s?'<label>씬 제목</label><input data-field="title" value="'+esc(s.title)+'"><div class="inline"><div><label>화자</label><input data-field="speaker" value="'+esc(s.speaker)+'"></div><div><label>배경 색상</label><input data-field="background" type="color" value="'+esc(s.background)+'"></div></div><div class="inline"><div><label>캐릭터</label><select data-field="character">'+data.characters.map(c=>'<option value="'+esc(c.id)+'" '+(c.id===s.character?'selected':'')+'>'+esc(c.name)+'</option>').join("")+'</select></div><div><label>표정</label><select data-field="expression">'+expressions.map(e=>'<option '+(s.expression===e?'selected':'')+'>'+e+'</option>').join("")+'</select></div></div><label>대사</label><textarea data-field="text">'+esc(s.text)+'</textarea><h3>선택지 (없으면 장면 종료)</h3>'+s.choices.map((choice,i)=>'<div class="panel stack"><label>선택지 '+(i+1)+'</label><input data-choice="'+i+'" data-prop="text" value="'+esc(choice.text)+'"><label>다음 씬</label><select data-choice="'+i+'" data-prop="next"><option value="">종료</option>'+data.scenes.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===choice.next?'selected':'')+'>'+esc(x.title)+'</option>').join("")+'</select><label>효과 (예: 현금 -100)</label><input data-choice="'+i+'" data-prop="effect" value="'+esc(choice.effect||"")+'"><button class="danger" data-remove-choice="'+i+'">선택지 삭제</button></div>').join("")+'<div class="row"><button id="addChoice">+ 선택지</button><button id="removeScene" class="danger">씬 삭제</button></div>':'씬을 생성하세요')+'</div></div>'}
function applyEffect(choice){const m=/^(.+?)\s*([+-])\s*(\d+(?:\.\d+)?)$/.exec(choice.effect||"");if(m){const k=m[1].trim();playVars[k]=(Number(playVars[k])||0)+(m[2]==="+"?1:-1)*Number(m[3])}}
function player(){const s=data.scenes.find(x=>x.id===playId),c=data.characters.find(x=>x.id===s?.character),bundle=s?.masterVersion?c?.masterVersions?.find(v=>v.version===s.masterVersion)||c:c,a=s?.expressionAssetVersion?c?.expressionVersions?.find(v=>v.version===s.expressionAssetVersion):bundle?.expressions[s?.expression];let art=a&&(s?.expressionAssetVersion||bundle.approved.includes(s.expression))?a.src:bundle?.master?.src;return '<div class="row between"><h2>플레이 테스트</h2><button id="playReset">처음부터</button></div><div class="grid"><div class="panel"><h3>상태 변수</h3><pre>'+esc(JSON.stringify(playVars,null,2))+'</pre><p class="muted">변수 효과 구문: 현금 -100, 제품 완성도 +20</p><h3>이동 이력</h3><pre>'+esc(playHistory.join(" → ")||"시작 전")+'</pre></div><div class="panel"><div class="preview" style="background:'+(s?esc(s.background):"#293650")+'">'+(art?'<img class="actor" src="'+art+'" alt="캐릭터">':s?'<div class="blank">승인된 이미지 또는 마스터를 업로드해 주세요</div>':'')+(s?'<div class="dialog"><div class="speaker">'+esc(s.speaker)+'</div><p>'+esc(s.text)+'</p></div>':'<div class="blank">게임 종료</div>')+'</div><div class="stack" style="margin-top:12px">'+(s?(s.choices.length?s.choices.map((x,i)=>'<button data-pick="'+i+'">'+esc(x.text)+' → '+esc(x.effect||"변화 없음")+'</button>').join(""):'<button data-end="1">장면 종료</button>'):'<p class="notice">마지막 장면에 도달했습니다. 처음부터 버튼으로 다시 시작할 수 있습니다.</p>')+'</div></div></div>'}
function bind(){if(tab==="dashboard"){$("#projectName").onchange=e=>setData(()=>data.name=e.target.value);$("#goCharacters").onclick=()=>nav("characters");$("#goScenes").onclick=()=>nav("scenes");$("#goPlay").onclick=()=>nav("play");$("#resetProject").onclick=()=>{if(confirm("모든 로컬 변경을 초기화할까요?")){data=initial();playStarted=false;charId="founder";sceneId="scene_1";save();render()}}}
if(tab==="characters"){$("#addCharacter").onclick=()=>setData(()=>{const id=uid();data.characters.push({id,name:"새 캐릭터",description:"",master:null,expressions:{},approved:[],canvas:{w:1024,h:1536}});charId=id});$("#charSelect")?.addEventListener("change",e=>{charId=e.target.value;render()});if(ch()){$("#generateMaster").onclick=generateMaster;$("#variationExpression").onchange=e=>{variationExpression=e.target.value;render()};$("#generateVariation").onclick=generateVariation;$("#approveVariation")?.addEventListener("click",approveVariation);$("#discardVariation")?.addEventListener("click",()=>setData(()=>delete ch().variationCandidates[variationExpression]));$("#adoptMaster")?.addEventListener("click",adoptMaster);$("#discardMaster")?.addEventListener("click",()=>setData(()=>delete ch().pendingMaster));$("#charName").onchange=e=>setData(()=>ch().name=e.target.value);$("#charDesc").onchange=e=>setData(()=>ch().description=e.target.value);$("#masterUpload").onchange=e=>upload(charId,"master",e.target.files[0]);document.querySelectorAll("[data-upload]").forEach(x=>x.onchange=e=>upload(charId,x.dataset.upload,e.target.files[0]));document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>setData(()=>{const c=ch(),e=b.dataset.approve;if(c.approved.includes(e))c.approved=c.approved.filter(v=>v!==e);else c.approved.push(e)}));$("#compareExpression").onchange=e=>$("#compareTarget").innerHTML=img(ch().expressions[e.target.value]?.src)}}
if(tab==="scenes"){$("#addScene").onclick=()=>setData(()=>{const id=uid();data.scenes.push({id,title:"새 씬",speaker:"",character:data.characters[0]?.id||"",expression:"neutral",background:"#435272",text:"대사를 입력하세요.",choices:[]});sceneId=id});document.querySelectorAll("[data-scene]").forEach(e=>e.onclick=()=>{sceneId=e.dataset.scene;render()});if(sc()){document.querySelectorAll("[data-field]").forEach(e=>e.onchange=()=>setData(()=>editSceneField(e.dataset.field,e.value)));document.querySelectorAll("[data-choice]").forEach(e=>e.onchange=()=>setData(()=>sc().choices[Number(e.dataset.choice)][e.dataset.prop]=e.value));$("#addChoice").onclick=()=>setData(()=>sc().choices.push({text:"새 선택지",next:"",effect:""}));document.querySelectorAll("[data-remove-choice]").forEach(e=>e.onclick=()=>setData(()=>sc().choices.splice(Number(e.dataset.removeChoice),1)));$("#removeScene").onclick=()=>{if(!confirm("이 씬을 삭제할까요?"))return;setData(()=>{data.scenes=data.scenes.filter(x=>x.id!==sceneId);sceneId=data.scenes[0]?.id||""})}}}
if(tab==="play"){$("#playReset").onclick=()=>{resetPlay();render()};document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const s=data.scenes.find(x=>x.id===playId),choice=s?.choices[Number(b.dataset.pick)];if(!choice)return;applyEffect(choice);playHistory.push(s.title);playId=choice.next||"";render()});document.querySelector("[data-end]")?.addEventListener("click",()=>{const s=data.scenes.find(x=>x.id===playId);if(s)playHistory.push(s.title);playId="";render()})}}
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));if(tab==="play"&&!playStarted)resetPlay();app.innerHTML=tab==="dashboard"?dashboard():tab==="characters"?characters():tab==="scenes"?scenes():player();bind()}
render();
</script></body></html>
